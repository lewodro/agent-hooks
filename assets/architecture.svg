<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Agent Hooks architecture overview">
  <title>Agent Hooks architecture overview</title>
  <rect width="720" height="320" fill="#050811"/>
  <g font-family="Space Mono, monospace" font-size="13" fill="#E7F0FF" letter-spacing="1.5">
    <rect x="32" y="40" width="180" height="60" fill="none" stroke="#00FF66" stroke-width="2"/>
    <text x="122" y="68" text-anchor="middle">ADAPTERS · rim</text>
    <text x="122" y="86" text-anchor="middle" font-size="11" fill="#00FF66">marginfi · kamino · solend</text>

    <rect x="270" y="40" width="180" height="60" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <text x="360" y="68" text-anchor="middle">RUNTIME · middle</text>
    <text x="360" y="86" text-anchor="middle" font-size="11" fill="#00E5FF">composition · simulator</text>

    <rect x="508" y="40" width="180" height="60" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <text x="598" y="68" text-anchor="middle">EXECUTOR · core</text>
    <text x="598" y="86" text-anchor="middle" font-size="11" fill="#00E5FF">anchor 0.31 program</text>

    <line x1="212" y1="70" x2="270" y2="70" stroke="#00FF66" stroke-width="2"/>
    <polygon points="262,66 270,70 262,74" fill="#00FF66"/>
    <line x1="450" y1="70" x2="508" y2="70" stroke="#00FF66" stroke-width="2"/>
    <polygon points="500,66 508,70 500,74" fill="#00FF66"/>

    <rect x="32" y="160" width="656" height="120" fill="none" stroke="#00FF66" stroke-width="1" stroke-dasharray="6 6"/>
