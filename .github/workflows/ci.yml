name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_hooks
          POSTGRES_PASSWORD: agent_hooks
          POSTGRES_DB: agent_hooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_hooks -d agent_hooks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_HOOKS_TEST_DATABASE_URL: postgres://agent_hooks:agent_hooks@localhost:5432/agent_hooks_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: exercise durable replay against PostgreSQL
        run: pnpm --filter @agent-hooks/agent-brain test:postgres
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  manifests:
    name: manifest vs README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check libs advertised in README live in some Cargo.toml or package.json
        shell: bash
        run: |
          set -e
          checks=(
            "Marginfi:marginfi-client-v2"
            "Kamino:klend-sdk"
            "Solend:solend-sdk"
            "Anchor 0.31:anchor-lang"
          )
          for entry in "${checks[@]}"; do
            label="${entry%%:*}"
            dep="${entry##*:}"
            if grep -qi "$label" README.md; then
              if ! grep -rqE "$dep" packages/ --include="Cargo.toml" --include="package.json"; then
                echo "::error::README mentions '$label' but no manifest declares '$dep'"
                exit 1
              fi
            fi
          done
          echo "manifest OK"
