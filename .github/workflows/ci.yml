name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  manifests:
    name: manifest vs README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check libs advertised in README live in some Cargo.toml or package.json
        shell: bash
        run: |
          set -e
          checks=(
            "Marginfi:marginfi-client-v2"
            "Kamino:klend-sdk"
            "Solend:solend-sdk"
            "Anchor 0.31:anchor-lang"
          )
          for entry in "${checks[@]}"; do
            label="${entry%%:*}"
            dep="${entry##*:}"
            if grep -qi "$label" README.md; then
              if ! grep -rqE "$dep" packages/ --include="Cargo.toml" --include="package.json"; then
                echo "::error::README mentions '$label' but no manifest declares '$dep'"
                exit 1
              fi
            fi
          done
          echo "manifest OK"
