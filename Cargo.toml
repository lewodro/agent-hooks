[workspace]
resolver = "2"
members = [
    "packages/hook-runtime",
    "packages/hook-library",
    "packages/anchor-program/programs/agent-hooks-executor",
    "packages/anchor-program/programs/agent-hooks-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lewodro/agent-hooks"
authors = ["AGENT HOOKS contributors"]

[workspace.dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
borsh = "0.10.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
